name: Build and Push ReedMuhn Lavalink

# Publishes the Lavalink image on its own, separate from the bot/webui
# workflow: any push to the `lavalink` branch rebuilds and republishes
# reedmuhn-bot-lavalink:latest to Docker Hub. Push to that branch (it
# doesn't need to be merged into main for this to run) whenever you
# change anything under lavalink/ - the Dockerfile, application.yml,
# or plugin versions.

on:
  push:
    branches:
      - lavalink
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dedicated Lavalink image
        uses: docker/build-push-action@v6
        with:
          context: ./lavalink
          file: ./lavalink/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/reedmuhn-bot-lavalink:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
