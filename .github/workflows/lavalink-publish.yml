name: Build and Push ReedMuhn Lavalink

# Publishes the Lavalink image on its own, separate from the bot/webui
# workflow: any push to the `lavalink` branch rebuilds and republishes
# reedmuhn-bot:lavalink to Docker Hub, as a tag in the same reedmuhn-bot
# repository as :bot/:webui (not a separate repo). Push to that branch
# (it doesn't need to be merged into main for this to run) whenever you
# change anything under lavalink/ - the Dockerfile, application.yml, or
# plugin versions.

on:
  push:
    branches:
      - lavalink
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push dedicated Lavalink image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./lavalink
          file: ./lavalink/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/reedmuhn-bot:lavalink
          cache-from: type=gha
          cache-to: type=gha,mode=max
