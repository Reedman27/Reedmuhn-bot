name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # ubuntu-latest already ships Python 3; a venv avoids the system-pip
      # "externally managed" error and needs no third-party action.
      - name: Install dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt -r webui/requirements.txt -r tests/requirements.txt

      - name: Bot tests
        run: $RUNNER_TEMP/venv/bin/python -m pytest tests -q

      - name: Dashboard tests
        working-directory: webui
        run: $RUNNER_TEMP/venv/bin/python -m pytest tests -q

  build-and-push:
    # Never publish an image from a commit whose tests fail.
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push bot image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/reedmuhn-bot:bot
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push webui image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./webui/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/reedmuhn-bot:webui
          cache-from: type=gha
          cache-to: type=gha,mode=max

