name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Install dashboard test dependencies
        run: python -m pip install -r webui/requirements.txt pytest httpx
      - name: Run WebUI regression tests
        run: python -m pytest webui/tests -q
      - name: Audit bot dependencies
        run: pip-audit -r requirements.txt
      - name: Audit dashboard dependencies
        run: pip-audit -r webui/requirements.txt
