services:
  discord-bot:
    image: ${DOCKERHUB_USERNAME:-reedman27}/reedmuhn-bot:bot
    build: .
    container_name: mybot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:?DISCORD_TOKEN_required_in_.env}
      - DB_PATH=/app/data/bot.db
      - DEV_GUILD_ID=${DEV_GUILD_ID}
      - LAVALINK_HOST=${LAVALINK_HOST:-lavalink}
      - LAVALINK_PORT=${LAVALINK_PORT:-2333}
      - LAVALINK_SECURE=${LAVALINK_SECURE:-0}
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - MUSIC_SEARCH_PLATFORM=${MUSIC_SEARCH_PLATFORM:-youtube}
      - MUSIC_LYRICS_PLATFORM=${MUSIC_LYRICS_PLATFORM:-lrclib}
      - MUSIC_MAX_QUEUE=${MUSIC_MAX_QUEUE:-1000}
      - MUSIC_MAX_PLAYLISTS=${MUSIC_MAX_PLAYLISTS:-10}
      - MUSIC_MAX_TRACKS=${MUSIC_MAX_TRACKS:-500}
      - MUSIC_INACTIVE_CLEANUP=${MUSIC_INACTIVE_CLEANUP:-600}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-10485760}
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT:-10}
      - REDIS_URL=redis://redis:6379/0
      - FEED_RETENTION_DAYS=${FEED_RETENTION_DAYS:-0}
    volumes:
      - ./data:/app/data:z
    depends_on:
      - lavalink
      - redis

  redis:
    image: redis:7-alpine
    container_name: mybot-redis
    restart: unless-stopped
    # Cooldowns/rate-limits/automod counters only - nothing here is data you
    # need to keep forever (that's SQLite's job), but AOF persistence means a
    # restart doesn't reset everyone's cooldowns/rate limits for no reason.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data:Z
    expose:
      - "6379" # only reachable from other containers on this compose network - never publish this port to the host

  lavalink:
    image: ${LAVALINK_IMAGE:-docker.io/reedman27/reedmuhn-bot:lavalink}
    build: ./lavalink
    # Docker/Podman can use the published :lavalink tag (same reedmuhn-bot
    # repo as :bot/:webui), or build the same image locally with --build
    # when developing the lavalink branch.
    container_name: mybot-lavalink
    restart: unless-stopped
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      # Lavalink itself is a Java process - give it real headroom (default
      # is 25% of container memory / 1GB, whichever is lower).
      - _JAVA_OPTIONS=-Xmx1G
    volumes:
      # Persists downloaded plugin jars (youtube-source etc.) between
      # restarts so they aren't re-fetched from Maven every boot.
      - ./data/lavalink-plugins:/opt/Lavalink/plugins:Z
    expose:
      - "2333" # only reachable from other containers on this compose network - not published to the host

  webui:
    image: ${DOCKERHUB_USERNAME:-reedman27}/reedmuhn-bot:webui
    build: ./webui
    container_name: mybot-webui
    restart: unless-stopped
    environment:
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID_required_in_.env}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET_required_in_.env}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:?DISCORD_REDIRECT_URI_required_in_.env}
      - DB_PATH=/app/data/bot.db
      - WEBUI_HTTPS_ONLY=${WEBUI_HTTPS_ONLY:-0}
      - WEBUI_TRUST_PROXY=${WEBUI_TRUST_PROXY:-0}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data:z
    depends_on:
      - redis
    ports:
      # Defaults to all interfaces (same as before). Set WEBUI_BIND_ADDRESS=127.0.0.1
      # in .env to keep the dashboard off the network and reach it via a reverse
      # proxy or SSH tunnel, or to a VPN/LAN IP to limit which interface serves it.
      - "${WEBUI_BIND_ADDRESS:-0.0.0.0}:8490:8080"
