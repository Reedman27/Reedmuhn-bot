<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reedmuhn Bot{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app">
    <aside class="sidebar">
        <div class="brand">🤖 Reedmuhn Bot</div>
        <div class="server-name" title="{{ guild_name }}">{{ guild_name }}</div>
        <nav>
            <a href="/guild/{{ guild_id }}" class="{{ 'active' if active == 'overview' else '' }}">📊 Overview</a>
            <a href="/guild/{{ guild_id }}/moderation" class="{{ 'active' if active == 'moderation' else '' }}">🛡️ Moderation</a>
            <a href="/guild/{{ guild_id }}/welcome" class="{{ 'active' if active == 'welcome' else '' }}">👋 Welcome & Roles</a>
            <a href="/guild/{{ guild_id }}/commands" class="{{ 'active' if active == 'commands' else '' }}">⚡ Custom Commands</a>
            <a href="/guild/{{ guild_id }}/birthdays" class="{{ 'active' if active == 'birthdays' else '' }}">🎂 Birthdays</a>
            <a href="/guild/{{ guild_id }}/counting" class="{{ 'active' if active == 'counting' else '' }}">🔢 Counting</a>
            <a href="/guild/{{ guild_id }}/youtube" class="{{ 'active' if active == 'youtube' else '' }}">📺 YouTube</a>
            <a href="/guild/{{ guild_id }}/automod" class="{{ 'active' if active == 'automod' else '' }}">🚨 Automod</a>
            <a href="/guild/{{ guild_id }}/tempvoice" class="{{ 'active' if active == 'tempvoice' else '' }}">🎙️ Temp Voice</a>
            <a href="/guild/{{ guild_id }}/reactionroles" class="{{ 'active' if active == 'reactionroles' else '' }}">🎭 Reaction Roles</a>
            <a href="/guild/{{ guild_id }}/scheduled" class="{{ 'active' if active == 'scheduled' else '' }}">⏰ Tasks</a>
            <a href="/guild/{{ guild_id }}/permissions" class="{{ 'active' if active == 'permissions' else '' }}">🔐 Permissions</a>
        </nav>
        <div class="sidebar-footer">
            <form action="/switch-guild" method="post">
                <span class="muted">{{ guild_name }}</span>
                <button type="submit" class="link-btn">switch</button>
            </form>
            <a href="/logout" class="logout">Log out</a>
        </div>
    </aside>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
